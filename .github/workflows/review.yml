name: Review

# A second agent reviews every pull request with fresh context. Its verdict is the required
# check "review". When it fails on an agent branch, the coding agent is asked to fix the
# findings, at most 3 rounds. On an agent branch it runs only after phase 2 (see docs/plan.md,
# step 6): until `acceptance` has checked the tests and the coding agent has pushed on top of the
# checked commit, the check fails without a review.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: review-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for phase 2
        id: phase
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$BRANCH" != agent/* ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          checked=$(gh pr view "$PR" --json comments --jq \
            '[.comments[] | select(.author.login == "github-actions" and (.body | test("^## Acceptance (checked |reset)")))] | last | .body // "" | split(" ") | .[3] // ""')
          git show origin/main:.github/acceptance/phase.mjs > "$RUNNER_TEMP/phase.mjs"
          out=$(node "$RUNNER_TEMP/phase.mjs" "$HEAD_SHA" "$checked" "$RUNNER_TEMP/phase-findings.md")
          if [ -n "$checked" ] && [ "$checked" != "$HEAD_SHA" ] && grep -qx 'phase=2' <<< "$out" \
              && grep -qx 'violation=false' <<< "$out"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Not after phase 2
        if: steps.phase.outputs.ready != 'true'
        run: |
          echo "::error::Phase 2 has not produced the production code yet; the review waits."
          exit 1
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          # The agent's turns in the log, to see why a review ended without a verdict. The
          # repository is public, and so is all the reviewer reads; secrets stay masked.
          show_full_output: true
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Write,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
          prompt: |
            You are the reviewer of pull request #${{ github.event.number }} in ${{ github.repository }}.
            Nobody else reads the code of this pull request, so you are the gate. You did not
            write the change. Read CLAUDE.md and docs/plan.md, the issue that the pull request
            closes (`gh issue view <n>`), then the diff (`gh pr diff ${{ github.event.number }}`)
            and the code around it.

            Fail the review for any of these, and only for these:
            - The change does not do what the pull request or its issue says, or does more.
            - A bug, a security problem, or data loss.
            - Behaviour that is added or changed without a test that covers it.
            - A broken rule from CLAUDE.md, anything outside the scope of the current step in
              docs/plan.md, or a change under `.github/` that the pull request does not need.
            - The description of a pull request from an `agent/*` branch has no demo tour (see
              "Demo tour" in CLAUDE.md), the block is not a valid JSON list of steps, a step
              does not match the change, or a selector matches no element in the code.
            - A security finding from the security pass below.
            Style preferences are not findings.

            Security pass, on every pull request, before the verdict. Check the change, not the
            whole app, for:
            - The OWASP Top 10 (2021) as far as the change touches it: broken access control
              (an endpoint or action without the login or the right check), injection (SQL,
              command, HTML, prompt), insecure design, security misconfiguration (open CORS,
              exposed actuator or error details, weak headers), vulnerable or outdated
              components, authentication failures, integrity failures (unpinned actions,
              unverified downloads), missing logging of security events, SSRF.
            - Untrusted input reaching an agent: the text of issues, comments, pull request
              titles and descriptions, branch names and file contents of a pull request, used in
              a prompt, a `run:` block, a shell command or an `--allowedTools` entry without
              being treated as data. A workflow must pass such text through `env:`, never
              as a GitHub expression written into a script.
            - Token handling by "Secrets per job" in docs/process.md: a secret or a wider
              `permissions:` for a job than the table lists, a secret in a job that runs code of
              the pull request, a token printed, logged, committed, put in a URL or an artifact,
              `persist-credentials` left on, a secret given to a step that does not need it.
            - New dependencies (`build.gradle`, `frontend/package.json`, Docker images, actions):
              needed by the change, maintained, from the expected publisher (typosquatting),
              pinned like the others, and without a known vulnerability that you can name.
            A finding needs a concrete path from the change to the harm; say which input reaches
            which sink. A hunch without one is not a finding. Findings of the pass are numbered
            like all others and fail the review.

            Post exactly one comment with `gh pr comment ${{ github.event.number }} --body ...`.
            It starts with the line `## Review round`, followed by PASS or FAIL and, for FAIL,
            a numbered list of findings. Each finding names the file and says what is wrong and
            what is expected, so that another agent can fix it without asking.
            Then write the single word PASS or FAIL to `${{ runner.temp }}/verdict` with the Write
            tool, in a call of its own after the comment. Not with a shell redirection in the same
            command as `gh pr comment`: a Bash command may not write outside the checkout, and a
            denied command also loses the comment.
      - name: Verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          BRANCH: ${{ github.head_ref }}
          VERDICT_FILE: ${{ runner.temp }}/verdict
        run: |
          verdict=$(cat "$VERDICT_FILE" 2>/dev/null || echo FAIL)
          [ "$verdict" = PASS ] && exit 0

          rounds=$(gh pr view "$PR" --json comments \
            --jq '[.comments[] | select(.body | startswith("## Review round"))] | length')
          if [[ "$BRANCH" == agent/* && "$rounds" -ge 1 && "$rounds" -lt 3 ]]; then
            gh workflow run agent.yml -f pr="$PR"
          elif [[ "$BRANCH" == agent/* && "$rounds" -ge 3 ]]; then
            gh pr comment "$PR" --body "The review failed in $rounds rounds. Waiting for the human."
          fi
          exit 1
