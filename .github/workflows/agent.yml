name: Agent

# Takes a labelled issue to a pull request, fixes the findings of a failed review, or implements
# a comment on a pull request that starts with "## Human feedback" (from the preview bar or
# written on GitHub; no round limit). Needs the Claude GitHub App (so that the agent's pushes
# start CI) and the secret CLAUDE_CODE_OAUTH_TOKEN, see README.

# The app reads this to show which issue or pull request the agent works on.
run-name: "Agent #${{ github.event.issue.number || inputs.pr }}"

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request whose review findings are to be fixed
        required: true

jobs:
  work:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issues' && github.event.label.name == 'agent')
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && startsWith(github.event.comment.body, '## Human feedback')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    concurrency: agent-${{ github.event.issue.number || inputs.pr }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check out the pull request branch
        if: github.event_name != 'issues'
        run: gh pr checkout "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || github.event.issue.number }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Implement the issue
        if: github.event_name == 'issues'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(./gradlew:*),Bash(pnpm:*),Bash(git:*),Bash(gh pr create:*),Bash(gh issue view:*)"
          prompt: |
            Implement GitHub issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            Read the issue with `gh issue view ${{ github.event.issue.number }}`, and read
            CLAUDE.md and docs/plan.md first and follow them.

            - Work on the new branch `agent/issue-${{ github.event.issue.number }}`. Never push
              to `main`.
            - Do only what the issue asks. Add tests that cover the behaviour you add or change.
            - Run `./gradlew build` and make it pass before you push.
            - Commit with a Conventional Commit message, push the branch and open a pull request
              with `gh pr create`. The description says what changed and how to try it, and ends
              with "Closes #${{ github.event.issue.number }}".
            - Do not touch anything under `.github/`.
      - name: Fix the review findings
        if: github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: github-actions
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(./gradlew:*),Bash(pnpm:*),Bash(git:*),Bash(gh pr view:*)"
          prompt: |
            The review of pull request #${{ inputs.pr }} in ${{ github.repository }} found problems.
            Read the latest comment that starts with "## Review round" with
            `gh pr view ${{ inputs.pr }} --comments`, and read CLAUDE.md.

            - You are on the branch of the pull request. Fix exactly the findings of that comment
              and nothing else.
            - Run `./gradlew build` and make it pass before you push.
            - Commit with a Conventional Commit message and push to this branch. Never push to
              `main`, and do not touch anything under `.github/`.
      - name: Implement the human feedback
        if: github.event_name == 'issue_comment'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(./gradlew:*),Bash(pnpm:*),Bash(git:*),Bash(gh pr view:*),Bash(gh issue view:*)"
          prompt: |
            The human tried pull request #${{ github.event.issue.number }} in ${{ github.repository }}
            in its preview app and left feedback. Read the latest comment that starts with
            "## Human feedback" with `gh pr view ${{ github.event.issue.number }} --comments`, and
            read CLAUDE.md and docs/plan.md.

            - You are on the branch of the pull request. Implement exactly that feedback and
              nothing else. Add or adjust tests that cover the behaviour you change.
            - Run `./gradlew build` and make it pass before you push.
            - Commit with a Conventional Commit message and push to this branch. Never push to
              `main`, and do not touch anything under `.github/`.
