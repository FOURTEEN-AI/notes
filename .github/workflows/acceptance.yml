name: Acceptance

# Required check `acceptance`: do the acceptance tests of an agent pull request match the
# scenarios that the human approved (latest "## Acceptance criteria" comment on its issue), as a
# delta against the tests of `main`, and does every stage and fake method that changed against `main`
# implement its step in every scenario that uses it (Jev, Haiku in between)? A failure is posted as "## Acceptance round <n>", at most 3
# rounds, then the pull request waits for the human. Each round starts the coding agent. Pull requests that are not from an
# `agent/issue-<n>` branch have no criteria and pass.
#
# It also drives the two phases of the coding agent (`.github/acceptance/phase.mjs`). Green in phase 1
# records the checked commit in a comment "## Acceptance checked <sha>" and starts phase 2. In phase 2
# the acceptance tests, stages and fakes must equal that commit, otherwise this is a finding.
#
# Late conflicts: an old test of `main` that is red after phase 2, or findings while the branch is
# behind `main` and does not merge with it (a parallel pull request changed the same lines), are no
# findings for the coding agent: the comment "## Acceptance conflict" sends the idea back to the
# idea chat (agent.yml, input `conflict`). A branch that is behind but merges cleanly is no conflict:
# the round tells the coding agent to merge `main` first and then fix the findings.
#
# Two jobs, because the acceptance tests of the pull request are code under check: `tests` runs them
# with no token, no secret and no cache, and hands over only their JGiven report. `acceptance` has
# the token and the secrets and runs no code of the pull request; it reads its files as text. It
# restores no Gradle cache either, since the pull request's jobs may have written one.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: acceptance-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: acceptance tests
    if: startsWith(github.head_ref, 'agent/issue-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      # In phase 1 the tests are red against the stubs, in phase 2 an old red test is a late
      # conflict; only the report matters.
      - run: ./gradlew test --tests 'de.fourteen.notes.acceptance.*' --rerun-tasks || true
      - uses: actions/upload-artifact@v4
        with:
          name: jgiven-head
          path: build/jgiven-results/test
          if-no-files-found: ignore

  acceptance:
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.number }}
      BRANCH: ${{ github.head_ref }}
    steps:
      - name: Find the issue
        id: issue
        run: |
          if [[ "$BRANCH" =~ ^agent/issue-([0-9]+)$ ]]; then
            echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "No agent branch, no acceptance criteria."
          fi
      # The check code and the tests of `main` come from the base. The pull request is checked out
      # as text only (sources, git history); its report comes from the job `tests`.
      - uses: actions/checkout@v5
        if: steps.issue.outputs.number
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v5
        if: steps.issue.outputs.number
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: steps.issue.outputs.number
        continue-on-error: true
        with:
          name: jgiven-head
          path: ${{ runner.temp }}/head-report
      # No report (the tests do not compile): every approved scenario is then without a test.
      - name: Make sure there is a report directory
        if: steps.issue.outputs.number
        run: mkdir -p "$RUNNER_TEMP/head-report"
      - name: Is the branch behind main
        id: behind
        if: steps.issue.outputs.number
        run: |
          git -C head merge-base --is-ancestor "origin/${{ github.base_ref }}" HEAD \
            && echo "behind=false" >> "$GITHUB_OUTPUT" || echo "behind=true" >> "$GITHUB_OUTPUT"
      # Only git, on the objects: touches no file of the pull request and runs none of its code.
      - name: Does the branch merge with main
        id: merges
        if: steps.behind.outputs.behind == 'true'
        run: |
          git -C head merge-tree --write-tree HEAD "origin/${{ github.base_ref }}" > /dev/null \
            && echo "clean=true" >> "$GITHUB_OUTPUT" || echo "clean=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        if: steps.issue.outputs.number
        with:
          distribution: temurin
          java-version: 25
      - uses: pnpm/action-setup@v4
        if: steps.issue.outputs.number
        with:
          package_json_file: base/frontend/package.json
      - uses: actions/setup-node@v5
        if: steps.issue.outputs.number
        with:
          node-version-file: base/.node-version
      - name: Find the phase
        id: phase
        if: steps.issue.outputs.number
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          checked=$(gh pr view "$PR" --json comments --jq \
            '[.comments[] | select(.author.login == "github-actions" and (.body | test("^## Acceptance (checked |reset)")))] | last | .body // "" | split(" ") | .[3] // ""')
          cd head
          node ../base/.github/acceptance/phase.mjs "$HEAD_SHA" "$checked" "$RUNNER_TEMP/phase-findings.md" \
            | tee -a "$GITHUB_OUTPUT"
      # Phase 2 changed the checked tests: nothing else to compare, the finding goes to the agent.
      - name: Phase violation
        if: steps.phase.outputs.violation == 'true'
        run: |
          cp "$RUNNER_TEMP/phase-findings.md" "$RUNNER_TEMP/findings.md"
          echo 1 > "$RUNNER_TEMP/exit_code"
      - name: Run the acceptance tests of main
        if: steps.issue.outputs.number && steps.phase.outputs.violation != 'true'
        run: cd base && ./gradlew test --tests 'de.fourteen.notes.acceptance.*' --rerun-tasks
      - name: Compare with the approved scenarios
        if: steps.issue.outputs.number && steps.phase.outputs.violation != 'true'
        env:
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |
          set -o pipefail
          # Only a human's criteria count, not ones an agent posted (criteria.mjs).
          gh issue view "$ISSUE" --json comments | node base/.github/acceptance/criteria.mjs \
            > "$RUNNER_TEMP/criteria.md"
          if [ ! -s "$RUNNER_TEMP/criteria.md" ]; then
            echo "Issue #$ISSUE has no approved acceptance criteria." | tee "$RUNNER_TEMP/findings.md"
            exit_code=1
          else
            node base/.github/acceptance/check.mjs "$RUNNER_TEMP/criteria.md" \
              base/build/jgiven-results/test "$RUNNER_TEMP/head-report" \
              | tee "$RUNNER_TEMP/findings.md" && exit_code=0 || exit_code=$?
          fi
          [ "$exit_code" = 0 ] && echo "ok" > "$RUNNER_TEMP/matches"
          echo "$exit_code" > "$RUNNER_TEMP/exit_code"
          exit 0
      # Only when the tests match the scenarios. The key and the token are only here; the step
      # reads the Java files of the pull request as text and runs none of its code.
      - name: Judge the changed stage and fake methods
        if: steps.issue.outputs.number && steps.phase.outputs.violation != 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          if [ -f "$RUNNER_TEMP/matches" ]; then
            npm install --global @anthropic-ai/claude-code
            # Exit 1: findings for the coding agent, anything else: the check itself is broken.
            node base/.github/acceptance/stages.mjs base head "$RUNNER_TEMP/head-report" | tee "$RUNNER_TEMP/findings.md" \
              && code=0 || code=$?
            echo "$code" > "$RUNNER_TEMP/exit_code"
          fi
      # The approved tests are checked and match; do old tests of main fail with this code?
      - name: Old tests that are red
        if: steps.issue.outputs.number && steps.phase.outputs.phase == '2' && steps.phase.outputs.violation != 'true'
        run: |
          if [ "$(cat "$RUNNER_TEMP/exit_code")" = 0 ]; then
            node base/.github/acceptance/conflict.mjs "$RUNNER_TEMP/criteria.md" \
              base/build/jgiven-results/test "$RUNNER_TEMP/head-report" \
              | tee "$RUNNER_TEMP/conflict.md" || true
          fi
      - name: Report the findings, or start phase 2
        if: steps.issue.outputs.number
        run: |
          exit_code=$(cat "$RUNNER_TEMP/exit_code")
          # The delta does not fit main any more: findings while the branch lacks what main got
          # meanwhile and cannot merge it. A clean merge is for the coding agent (see below).
          if [ "$exit_code" = 1 ] && [ "${{ steps.phase.outputs.violation }}" != true ] \
              && [ "${{ steps.merges.outputs.clean }}" = false ]; then
            cp "$RUNNER_TEMP/findings.md" "$RUNNER_TEMP/conflict.md"
          fi
          if [ -s "$RUNNER_TEMP/conflict.md" ]; then
            {
              echo "## Acceptance conflict"
              echo
              echo "The approved scenarios and the tests of main do not fit together any more (an old test is red, or main changed in the meantime):"
              echo
              cat "$RUNNER_TEMP/conflict.md"
            } | gh pr comment "$PR" --body-file -
            # The coding agent proposes an amended delta in the idea chat instead of fixing it.
            gh workflow run agent.yml -f pr="$PR" -f conflict=true
            exit 1
          fi
          if [ "$exit_code" = 0 ]; then
            # Green: in phase 1 the tests are checked now, and phase 2 starts.
            if [ "${{ steps.phase.outputs.phase }}" = 1 ]; then
              gh pr comment "$PR" --body "## Acceptance checked ${{ github.event.pull_request.head.sha }}"
              gh workflow run agent.yml -f pr="$PR"
            fi
            exit 0
          fi
          [ "$exit_code" = 1 ] || { echo "The acceptance check itself failed."; exit 1; }

          # The rounds count from the last "## Acceptance reset" (new approval of the idea).
          rounds=$(gh pr view "$PR" --json comments --jq \
            'reduce .comments[] as $c (0; if ($c.body | startswith("## Acceptance reset")) then 0
              elif ($c.body | startswith("## Acceptance round")) then . + 1 else . end)')
          if [ "$rounds" -lt 3 ]; then
            {
              echo "## Acceptance round $((rounds + 1))"
              echo
              echo "The acceptance tests do not match the approved scenarios, or a changed stage or fake method or do not implement their steps:"
              echo
              if [ "${{ steps.behind.outputs.behind }}" = true ]; then
                echo "The branch is behind \`main\` (it merges cleanly): merge \`origin/main\` first, then fix the findings."
                echo
              fi
              cat "$RUNNER_TEMP/findings.md"
            } | gh pr comment "$PR" --body-file -
            # The coding agent fixes the findings, like after a failed review.
            gh workflow run agent.yml -f pr="$PR"
          else
            gh pr comment "$PR" --body "Acceptance failed in $rounds rounds. Waiting for the human."
          fi
          exit 1
