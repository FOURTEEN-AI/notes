name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by dependency-updates.yml after it merged a pull request of Dependabot: a push made
  # with the GITHUB_TOKEN starts no workflow, so the deploy would not run.
  workflow_dispatch:

jobs:
  # No secret in the history and none in what an agent writes into the pull request. Needs no
  # secrets itself and never runs code of the pull request.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: .devcontainer/install-gitleaks.sh "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan the commits
        run: gitleaks git --redact --no-banner --verbose
      # The description and the comments of a pull request are public like the code. They are
      # scanned as they are at this run; a later edit is caught by the next run.
      - name: Scan the pull request text
        if: github.event_name == 'pull_request'
        run: |
          mkdir "$RUNNER_TEMP/text"
          printf '%s' "$BODY" > "$RUNNER_TEMP/text/description.md"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[].body' \
            > "$RUNNER_TEMP/text/comments.md"
          gitleaks dir "$RUNNER_TEMP/text" --redact --no-banner --verbose --config .gitleaks.toml
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          BODY: ${{ github.event.pull_request.body }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      phase1: ${{ steps.phase.outputs.phase1 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # On an agent branch the acceptance tests are red against the stubs until phase 2 has pushed
      # on top of the checked commit (docs/plan.md, step 6). Until then only compile; the same
      # test as in review.yml.
      - name: Find the phase
        id: phase
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$BRANCH" != agent/* ]]; then
            echo "phase1=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          checked=$(gh pr view "$PR" --json comments --jq \
            '[.comments[] | select(.author.login == "github-actions" and (.body | test("^## Acceptance (checked |reset)")))] | last | .body // "" | split(" ") | .[3] // ""')
          git show origin/main:.github/acceptance/phase.mjs > "$RUNNER_TEMP/phase.mjs"
          out=$(node "$RUNNER_TEMP/phase.mjs" "$HEAD_SHA" "$checked" "$RUNNER_TEMP/phase-findings.md")
          if [ -n "$checked" ] && [ "$checked" != "$HEAD_SHA" ] && grep -qx 'phase=2' <<< "$out" \
              && grep -qx 'violation=false' <<< "$out"; then
            echo "phase1=false" >> "$GITHUB_OUTPUT"
          else
            echo "phase1=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: ./gradlew compileTestJava
        if: steps.phase.outputs.phase1 == 'true'
      - run: ./gradlew build
        if: steps.phase.outputs.phase1 != 'true'
      - run: node --test .github/acceptance/criteria.test.mjs .github/acceptance/check.test.mjs .github/acceptance/stages.test.mjs .github/acceptance/phase.test.mjs .github/acceptance/conflict.test.mjs
      - uses: actions/upload-artifact@v4
        if: steps.phase.outputs.phase1 != 'true'
        with:
          name: notes-jar
          path: build/libs/notes.jar

  # The image that deploy and preview build, scanned before they run (docs/plan.md, step 8): OS
  # packages of the base image with a fix for a HIGH or CRITICAL vulnerability, and the
  # Dockerfile. The base image is pinned by digest, so the build of Fly gets the same one. Needs
  # no secrets. Skipped in phase 1 (no jar), which counts as green.
  image-scan:
    needs: build
    if: needs.build.outputs.phase1 != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: notes-jar
          path: build/libs
      - name: Install Trivy
        run: .devcontainer/install-trivy.sh "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: .github/image-scan.sh

  deploy:
    needs: [build, image-scan]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: notes-jar
          path: build/libs
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # A preview app per pull request. Only this job gets the Fly org token, and it only handles the
  # jar built above, never the code of the pull request itself.
  preview:
    needs: [build, image-scan]
    # Dependabot's own runs have no secrets, so no preview for them (docs/plan.md, step 7).
    if: >-
      github.event_name == 'pull_request' && needs.build.outputs.phase1 != 'true'
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency: preview-${{ github.event.number }}
    permissions:
      contents: read
      pull-requests: write
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_ORG_TOKEN }}
    steps:
      # The preview is named after the issue of an agent branch (agent/issue-<n>), else after the
      # pull request.
      - name: Name the preview
        run: |
          if [[ "$HEAD_REF" =~ ^agent/issue-([0-9]+)$ ]]; then N="issue-${BASH_REMATCH[1]}"; else N="pr-$PR"; fi
          echo "APP=notes-fourteen-it-$N" >> "$GITHUB_ENV"
          echo "DB=${N//-/_}" >> "$GITHUB_ENV"
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR: ${{ github.event.number }}
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: notes-jar
          path: build/libs
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the app and its database
        run: |
          if ! flyctl status --app "$APP" > /dev/null 2>&1; then
            flyctl apps create "$APP" --org "${{ vars.FLY_ORG }}"
            # Own database and user in the existing Postgres cluster; sets DATABASE_URL.
            flyctl postgres attach notes-fourteen-it-db --app "$APP" \
              --database-name "$DB" --database-user "$DB"
            flyctl secrets set --app "$APP" --stage \
              SPRING_SECURITY_USER_NAME="${{ secrets.PREVIEW_LOGIN_NAME }}" \
              SPRING_SECURITY_USER_PASSWORD="${{ secrets.PREVIEW_LOGIN_PASSWORD }}"
          fi
      # The token for the preview bar (comment and merge). Its own token, narrower than the one of
      # production, because the preview runs code of the pull request. Set on every run, so that
      # it reaches previews created before it existed and follows a rotated token.
      - name: Pass the GitHub token
        run: flyctl secrets set --app "$APP" --stage GITHUB_TOKEN="$GITHUB_APP_TOKEN"
        env:
          GITHUB_APP_TOKEN: ${{ secrets.PREVIEW_GITHUB_TOKEN }}
      # PULL_REQUEST turns on the preview bar for exactly this pull request. PULL_REQUEST_SHA
      # lets an open page notice that a newer commit is deployed.
      - run: >-
          flyctl deploy --app "$APP" --remote-only --ha=false
          --env PULL_REQUEST=${{ github.event.number }}
          --env PULL_REQUEST_SHA=${{ github.event.pull_request.head.sha }}
      - name: Link the preview in the pull request
        run: |
          # Edit only the preview comment: the acceptance markers are comments of the same user.
          body="Preview: https://$APP.fly.dev"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.number }}/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Preview: ")))] | last | .id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "${{ github.event.number }}" --body "$body"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
