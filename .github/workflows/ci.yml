name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      phase1: ${{ steps.phase.outputs.phase1 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # The checksum of gradle/wrapper/gradle-wrapper.jar must be one of an official Gradle release.
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      # On an agent branch the acceptance tests are red against the stubs until phase 2 has pushed
      # on top of the checked commit (docs/plan.md, step 6). Until then only compile; the same
      # test as in review.yml.
      - name: Find the phase
        id: phase
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$BRANCH" != agent/* ]]; then
            echo "phase1=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          checked=$(gh pr view "$PR" --json comments --jq \
            '[.comments[] | select(.author.login == "github-actions" and (.body | test("^## Acceptance (checked |reset)")))] | last | .body // "" | split(" ") | .[3] // ""')
          git show origin/main:.github/acceptance/phase.mjs > "$RUNNER_TEMP/phase.mjs"
          out=$(node "$RUNNER_TEMP/phase.mjs" "$HEAD_SHA" "$checked" "$RUNNER_TEMP/phase-findings.md")
          if [ -n "$checked" ] && [ "$checked" != "$HEAD_SHA" ] && grep -qx 'phase=2' <<< "$out" \
              && grep -qx 'violation=false' <<< "$out"; then
            echo "phase1=false" >> "$GITHUB_OUTPUT"
          else
            echo "phase1=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # Docker images pinned in the script; also useful in phase 1, so no phase condition.
      - run: .github/security-static.sh
      - run: ./gradlew compileTestJava
        if: steps.phase.outputs.phase1 == 'true'
      - run: ./gradlew build
        if: steps.phase.outputs.phase1 != 'true'
      # Needs the jar and node_modules of the build above: SBOMs, Trivy on them and on the image.
      - run: .github/supply-chain.sh
        if: steps.phase.outputs.phase1 != 'true'
      - run: node --test .github/acceptance/criteria.test.mjs .github/acceptance/check.test.mjs .github/acceptance/stages.test.mjs .github/acceptance/phase.test.mjs .github/acceptance/conflict.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.phase.outputs.phase1 != 'true'
        with:
          name: notes-jar
          path: build/libs/notes.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.phase.outputs.phase1 != 'true'
        with:
          name: notes-sbom
          path: build/sbom/*.cdx.json

  # End-to-end tests against the jar of `build`: Postgres in Docker, a GitHub stub, three browsers
  # (frontend/e2e). In its own job so it runs next to the rest of `build`. The browsers are cached
  # by Playwright version; the system libraries are installed each time.
  e2e:
    needs: build
    if: needs.build.outputs.phase1 != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notes-jar
          path: build/libs
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - id: playwright
        run: echo "version=$(node -p "require('./frontend/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: ./gradlew frontendInstall
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      # The jar comes from `build`; -x bootJar keeps Gradle from building it (and running the tests) again.
      - run: ./gradlew e2eTest e2eVisualTest -x bootJar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/playwright-report-visual
            frontend/test-results
            frontend/test-results-visual

  deploy:
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notes-jar
          path: build/libs
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test
        run: .github/smoke.sh notes-fourteen-it

  # A preview app per pull request. Only this job gets the Fly org token, and it only handles the
  # jar built above, never the code of the pull request itself.
  preview:
    needs: build
    if: github.event_name == 'pull_request' && needs.build.outputs.phase1 != 'true'
    runs-on: ubuntu-latest
    concurrency: preview-${{ github.event.number }}
    permissions:
      contents: read
      pull-requests: write
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_ORG_TOKEN }}
    steps:
      # The preview is named after the issue of an agent branch (agent/issue-<n>), else after the
      # pull request.
      - name: Name the preview
        run: |
          if [[ "$HEAD_REF" =~ ^agent/issue-([0-9]+)$ ]]; then N="issue-${BASH_REMATCH[1]}"; else N="pr-$PR"; fi
          echo "APP=notes-fourteen-it-$N" >> "$GITHUB_ENV"
          echo "DB=${N//-/_}" >> "$GITHUB_ENV"
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR: ${{ github.event.number }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notes-jar
          path: build/libs
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master
      - name: Create the app and its database
        env:
          FLY_ORG: ${{ vars.FLY_ORG }}
          APP_LOGIN_NAME: ${{ secrets.APP_LOGIN_NAME }}
          APP_LOGIN_PASSWORD: ${{ secrets.APP_LOGIN_PASSWORD }}
        run: |
          if ! flyctl status --app "$APP" > /dev/null 2>&1; then
            flyctl apps create "$APP" --org "$FLY_ORG"
            # Own database and user in the existing Postgres cluster; sets DATABASE_URL.
            flyctl postgres attach notes-fourteen-it-db --app "$APP" \
              --database-name "$DB" --database-user "$DB"
            flyctl secrets set --app "$APP" --stage \
              SPRING_SECURITY_USER_NAME="$APP_LOGIN_NAME" \
              SPRING_SECURITY_USER_PASSWORD="$APP_LOGIN_PASSWORD"
          fi
      # The token for the preview bar (comment and merge). Set on every run, so that it reaches
      # previews created before it existed and follows a rotated token.
      - name: Pass the GitHub token
        run: flyctl secrets set --app "$APP" --stage GITHUB_TOKEN="$GITHUB_APP_TOKEN"
        env:
          GITHUB_APP_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}
      # PULL_REQUEST turns on the preview bar for exactly this pull request. PULL_REQUEST_SHA
      # lets an open page notice that a newer commit is deployed.
      - run: >-
          flyctl deploy --app "$APP" --remote-only --ha=false
          --env PULL_REQUEST=${{ github.event.number }}
          --env PULL_REQUEST_SHA=${{ github.event.pull_request.head.sha }}
      - name: Smoke test
        run: .github/smoke.sh "$APP"
      - name: Link the preview in the pull request
        run: |
          # Edit only the preview comment: the acceptance markers are comments of the same user.
          body="Preview: https://$APP.fly.dev"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.number }}/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Preview: ")))] | last | .id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "${{ github.event.number }}" --body "$body"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
