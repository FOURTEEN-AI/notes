name: Preview cleanup

# Removes the preview app and its database when a pull request is closed.
# pull_request_target, because GitHub starts no pull_request workflow for a pull request with merge
# conflicts. Safe here: the job never checks out or runs code of the pull request.

on:
  pull_request_target:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions: {}
    concurrency: preview-${{ github.event.number }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_ORG_TOKEN }}
    steps:
      # The preview is named after the issue of an agent branch (agent/issue-<n>), else after the
      # pull request.
      - name: Name the preview
        run: |
          if [[ "$HEAD_REF" =~ ^agent/issue-([0-9]+)$ ]]; then N="issue-${BASH_REMATCH[1]}"; else N="pr-$PR"; fi
          echo "APP=notes-fourteen-it-$N" >> "$GITHUB_ENV"
          echo "DB=${N//-/_}" >> "$GITHUB_ENV"
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR: ${{ github.event.number }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Destroy the preview app
        run: flyctl apps destroy "$APP" --yes || true
      - name: Drop the preview database and user
        run: |
          flyctl ssh console --app notes-fourteen-it-db --command \
            "sh -c 'psql postgres://postgres:\$OPERATOR_PASSWORD@localhost:5432/postgres -c \"drop database if exists $DB with (force)\" -c \"drop role if exists $DB\"'"
