name: Preview cleanup

# Removes the preview app and its database when a pull request is closed.
# pull_request_target, because GitHub starts no pull_request workflow for a pull request with merge
# conflicts. Safe here: the job never checks out or runs code of the pull request.

on:
  pull_request_target:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency: preview-${{ github.event.number }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_ORG_TOKEN }}
    steps:
      # The scripts come from the default branch, never from the pull request.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Name the preview
        run: |
          N=$(infra/preview-name.sh "$HEAD_REF" "$PR")
          echo "APP=notes-fourteen-it-$N" >> "$GITHUB_ENV"
          echo "DB=${N//-/_}" >> "$GITHUB_ENV"
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR: ${{ github.event.number }}
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Remove the preview app and its database
        run: infra/preview-down.sh
        env:
          FLY_ORG: ${{ vars.FLY_ORG }}
