plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0'
	id 'com.tngtech.jgiven.gradle-plugin' version '3.0.0'
	id 'com.diffplug.spotless' version '8.2.1'
	id 'net.ltgt.errorprone' version '5.1.0'
}

group = 'de.fourteen.notes'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	runtimeOnly 'org.postgresql:postgresql'

	errorprone 'com.google.errorprone:error_prone_core:2.50.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'com.tngtech.jgiven:jgiven-junit5:3.0.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Error Prone findings in production code fail the build. Test code only warns: the acceptance
// tests, stages and fakes are checked files that a coding agent must not change in phase 2.
tasks.named('compileJava') {
	options.compilerArgs << '-Werror'
}

tasks.named('test') {
	useJUnitPlatform()
}


// One executable jar with a fixed name, which the Dockerfile copies.
tasks.named('jar') {
	enabled = false
}
tasks.named('bootJar') {
	archiveFileName = 'notes.jar'
	dependsOn 'jgivenTestReport'
	from(layout.buildDirectory.dir('reports/jgiven/test/html')) {
		into 'BOOT-INF/classes/static/jgiven'
	}
}

// The React frontend is built with pnpm and served by Spring Boot from classpath:/static.
def frontendDir = layout.projectDirectory.dir('frontend')

tasks.register('frontendInstall', Exec) {
	workingDir = frontendDir
	commandLine 'pnpm', 'install', '--frozen-lockfile'
	inputs.files(frontendDir.file('package.json'), frontendDir.file('pnpm-lock.yaml'))
	outputs.dir(frontendDir.dir('node_modules'))
}

tasks.register('frontendBuild', Exec) {
	dependsOn 'frontendInstall'
	workingDir = frontendDir
	commandLine 'pnpm', 'run', 'build'
	inputs.files(frontendDir.file('package.json'), frontendDir.file('pnpm-lock.yaml'),
			frontendDir.file('index.html'), frontendDir.file('tsconfig.json'),
			frontendDir.file('vite.config.ts'))
	inputs.dir(frontendDir.dir('src'))
	outputs.dir(frontendDir.dir('dist'))
}

tasks.named('processResources') {
	from(tasks.named('frontendBuild')) {
		into 'static'
	}
}

// Formatting: `./gradlew build` fails on unformatted code, `./gradlew format` fixes Java and frontend.
spotless {
	java {
		googleJavaFormat().aosp()
		removeUnusedImports()
		importOrder()
	}
}

tasks.register('prettierCheck', Exec) {
	dependsOn 'frontendInstall'
	workingDir = frontendDir
	commandLine 'pnpm', 'run', 'format:check'
	inputs.files(frontendDir.file('package.json'), frontendDir.file('pnpm-lock.yaml'),
			frontendDir.file('.prettierrc.json'), frontendDir.file('eslint.config.js'),
			frontendDir.file('index.html'),
			frontendDir.file('tsconfig.json'), frontendDir.file('vite.config.ts'))
	inputs.dir(frontendDir.dir('src'))
	outputs.upToDateWhen { true }
}

tasks.register('frontendLint', Exec) {
	dependsOn 'frontendInstall'
	workingDir = frontendDir
	commandLine 'pnpm', 'run', 'lint'
	inputs.files(frontendDir.file('package.json'), frontendDir.file('pnpm-lock.yaml'),
			frontendDir.file('eslint.config.js'), frontendDir.file('knip.json'),
			frontendDir.file('tsconfig.json'), frontendDir.file('vite.config.ts'),
			frontendDir.file('index.html'))
	inputs.dir(frontendDir.dir('src'))
	outputs.upToDateWhen { true }
}

tasks.register('prettierApply', Exec) {
	dependsOn 'frontendInstall'
	workingDir = frontendDir
	commandLine 'pnpm', 'run', 'format'
}

tasks.register('format') {
	dependsOn 'spotlessApply', 'prettierApply'
}

tasks.named('check') {
	dependsOn 'prettierCheck', 'frontendLint'
}
