# Every value can be overridden by an environment variable (e.g. SPRING_SECURITY_USER_PASSWORD).
spring:
  application:
    name: notes
  # The schema is created on every start (create table if not exists).
  sql:
    init:
      mode: always
  # Production and every preview share one small Postgres (512 MB RAM); keep each app's share small.
  datasource:
    hikari:
      maximum-pool-size: 3

server:
  shutdown: graceful

# The ideas and the preview bar talk to this repository. The token comes from GITHUB_TOKEN.
github:
  api-url: https://api.github.com
  repository: FOURTEEN-AI/notes
